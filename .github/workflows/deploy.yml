name: deploy

# Builds the site and publishes it to the Switchboard edge (Switchboard
# PAGES-004/PAGES-008). The edge trusts only this file, in this repository, on
# main, run by a push or by hand, through a GitHub OIDC token: no deploy
# secret is stored here. Renaming this file or the branch stops deployments
# until the edge's project trust is updated (server-ops render-preview-config.py).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time; a newer push waits instead of cancelling a
# deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_ENDPOINT: https://deploy.octaviosantacruz.com
  DEPLOY_PROJECT: portfolio
  SITE_URL: https://octaviosantacruz.com

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Refuse secrets in the build output
        run: scripts/ci/check-dist.sh dist

      - name: Pack
        run: tar -czf "$RUNNER_TEMP/site.tar.gz" -C dist .

      # The last build that passed acceptance, to put back if this one fails.
      # Re-uploading it makes the same content-addressed deployment live again.
      - name: Restore the last good build
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/last-good
          key: portfolio-live-${{ github.sha }}
          restore-keys: portfolio-live-

      - name: Deploy
        id: deploy
        run: |
          scripts/ci/publish.sh "$RUNNER_TEMP/site.tar.gz" "$RUNNER_TEMP/deployment.json"
          jq -r '"Deployed `\(.id[0:12])` from commit `\((.commit_sha // "unknown")[0:12])`, live: \(.live)"' \
            "$RUNNER_TEMP/deployment.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Public acceptance
        run: scripts/ci/accept.sh "$SITE_URL" dist

      - name: Remember this build as the last good one
        run: |
          mkdir -p "$RUNNER_TEMP/last-good"
          cp "$RUNNER_TEMP/site.tar.gz" "$RUNNER_TEMP/last-good/site.tar.gz"

      - name: Save the last good build
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/last-good
          key: portfolio-live-${{ github.sha }}

      - name: Roll back to the last good build
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          if [ -f "$RUNNER_TEMP/last-good/site.tar.gz" ]; then
            scripts/ci/publish.sh "$RUNNER_TEMP/last-good/site.tar.gz" "$RUNNER_TEMP/rollback.json"
            echo "Acceptance failed: rolled back to the last good build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Acceptance failed and no previous build is cached: roll back on the edge with 'switchboard site rollback -site portfolio'."
          fi
